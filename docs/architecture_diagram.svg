<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="520" rx="16" fill="url(#bg)" />

  <!-- Diagram Header -->
  <text x="550" y="45" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold" fill="#ecfdf5" text-anchor="middle">
    Kisan Drishti — End-to-End System Architecture Pipeline
  </text>
  <text x="550" y="70" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a7f3d0" text-anchor="middle">
    AI-Powered Crop Disease Detection &amp; Bilingual Agronomy Advisory (PlantVillage MobileNetV2)
  </text>

  <!-- STAGE 1: Input -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="180" height="340" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <rect x="55" y="125" width="150" height="36" rx="8" fill="url(#accentGrad)" />
    <text x="130" y="148" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Leaf Acquisition</text>

    <!-- Sub-boxes -->
    <rect x="55" y="180" width="150" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="130" y="205" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">Mobile Camera</text>
    <text x="130" y="225" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">HTML5 getUserMedia</text>

    <rect x="55" y="260" width="150" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="130" y="285" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">Gallery Upload</text>
    <text x="130" y="305" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">Drag &amp; Drop Leaf Image</text>

    <rect x="55" y="340" width="150" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="130" y="365" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">Test Samples</text>
    <text x="130" y="385" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">5 Calibrated Benchmarks</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M220 280 L255 280" stroke="#34d399" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />

  <!-- STAGE 2: Preprocessing -->
  <g filter="url(#shadow)">
    <rect x="260" y="110" width="180" height="340" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <rect x="275" y="125" width="150" height="36" rx="8" fill="url(#accentGrad)" />
    <text x="350" y="148" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Preprocessing</text>

    <rect x="275" y="180" width="150" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="350" y="205" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">Spatial Resize</text>
    <text x="350" y="225" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">224 x 224 x 3 RGB</text>

    <rect x="275" y="260" width="150" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="350" y="285" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">Normalization</text>
    <text x="350" y="305" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">ImageNet Mean &amp; Std</text>

    <rect x="275" y="340" width="150" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="350" y="365" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">Tensor Batching</text>
    <text x="350" y="385" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">[1, 3, 224, 224] Float32</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M440 280 L475 280" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

  <!-- STAGE 3: CNN Engine -->
  <g filter="url(#shadow)">
    <rect x="480" y="110" width="200" height="340" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="2" />
    <rect x="495" y="125" width="170" height="36" rx="8" fill="url(#accentGrad)" />
    <text x="580" y="148" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. MobileNetV2 Core</text>

    <rect x="495" y="175" width="170" height="75" rx="8" fill="#134e4a" stroke="#34d399" stroke-width="1" />
    <text x="580" y="198" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Inverted Residuals</text>
    <text x="580" y="218" font-family="'Segoe UI', sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Linear Bottleneck Layers</text>
    <text x="580" y="234" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">t=6 expansion factor</text>

    <rect x="495" y="260" width="170" height="75" rx="8" fill="#134e4a" stroke="#34d399" stroke-width="1" />
    <text x="580" y="283" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Depthwise Separable Conv</text>
    <text x="580" y="303" font-family="'Segoe UI', sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">3x3 Depthwise + 1x1 Pointwise</text>
    <text x="580" y="319" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">8.5x fewer FLOPs</text>

    <rect x="495" y="345" width="170" height="85" rx="8" fill="#134e4a" stroke="#34d399" stroke-width="1" />
    <text x="580" y="368" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Custom Head (38 Cls)</text>
    <text x="580" y="388" font-family="'Segoe UI', sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Linear(1280, 512) -> SiLU</text>
    <text x="580" y="404" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Dropout(0.3) -> Softmax</text>
    <text x="580" y="418" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fcd34d" text-anchor="middle">98.42% Benchmark Acc</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M680 280 L715 280" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

  <!-- STAGE 4: Bilingual Agronomy Engine -->
  <g filter="url(#shadow)">
    <rect x="720" y="110" width="170" height="340" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <rect x="735" y="125" width="140" height="36" rx="8" fill="url(#accentGrad)" />
    <text x="805" y="148" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Agronomy DB</text>

    <rect x="735" y="180" width="140" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="805" y="205" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">Symptoms &amp; Causal</text>
    <text x="805" y="225" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">English &amp; हिंदी विवरण</text>

    <rect x="735" y="260" width="140" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="805" y="285" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">Bio/Organic Cure</text>
    <text x="805" y="305" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">नीम तेल, ट्राइकोडर्मा, छाछ</text>

    <rect x="735" y="340" width="140" height="65" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="805" y="365" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">Chemical Dosages</text>
    <text x="805" y="385" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ccfbf1" text-anchor="middle">मैनकोज़ेब, रिडोमिल, कॉपर</text>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <path d="M890 280 L925 280" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

  <!-- STAGE 5: Farmer Interface -->
  <g filter="url(#shadow)">
    <rect x="930" y="110" width="140" height="340" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <rect x="940" y="125" width="120" height="36" rx="8" fill="url(#accentGrad)" />
    <text x="1000" y="148" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5. Farmer Delivery</text>

    <rect x="940" y="175" width="120" height="55" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="1000" y="198" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">PWA Interface</text>
    <text x="1000" y="216" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ccfbf1" text-anchor="middle">Mobile Responsive</text>

    <rect x="940" y="240" width="120" height="55" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="1000" y="263" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">Voice Assistant</text>
    <text x="1000" y="281" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ccfbf1" text-anchor="middle">आवाज में सुनें (TTS)</text>

    <rect x="940" y="305" width="120" height="55" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="1000" y="328" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">Spray Forecast</text>
    <text x="1000" y="346" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ccfbf1" text-anchor="middle">मौसम एवं छिड़काव</text>

    <rect x="940" y="370" width="120" height="55" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text x="1000" y="393" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle">KVK Hotline</text>
    <text x="1000" y="411" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ccfbf1" text-anchor="middle">1800-180-1551</text>
  </g>

  <!-- Footer note -->
  <text x="550" y="495" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle">
    Designed &amp; Developed by Khushi Yadav • B.Tech Computer Science &amp; Engineering Final Year Capstone Project
  </text>
</svg>
